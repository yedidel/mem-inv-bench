name: reference-integrity-extension

on:
  push:
    paths:
      - "extensions/reference-integrity-v1/**"
      - ".github/workflows/reference-integrity-extension.yml"
  pull_request:
    paths:
      - "extensions/reference-integrity-v1/**"
      - ".github/workflows/reference-integrity-extension.yml"

jobs:
  offline-reproduction:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/reference-integrity-v1
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            extensions/reference-integrity-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: ./reproduce_offline.sh
